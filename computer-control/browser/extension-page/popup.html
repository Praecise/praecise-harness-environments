<!doctype html>
<meta charset="utf-8" />
<title>Praecise Control</title>
<style>
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; width: 320px; color: #1a1a1a; background: #f4f4f2; }
  h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  p { margin: 0 0 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { background: #fff; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 5px 12px; background: #00787e; color: #fff; cursor: pointer; }
  #said { color: #a12a2a; }
</style>
<h1 id="heading"></h1>
<p id="about"></p>
<ul id="tabs"></ul>
<p id="said" role="status"></p>
<script src="popup.js"></script>
